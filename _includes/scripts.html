{% include analytics.html %}

<script>
  async function copyTextToClipboard(text) {
    // Modern API (works on HTTPS + most browsers)
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return true;
      }
    } catch (e) {
      // fall through
    }

    // Fallback for Safari/iOS/older browsers
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "absolute";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, ta.value.length);

    try {
      return document.execCommand("copy");
    } catch (e) {
      return false;
    } finally {
      document.body.removeChild(ta);
    }
  }

  document.addEventListener("click", async (e) => {
    const btn = e.target.closest(".pub-copy-btn");
    if (!btn) return;

    const id = btn.getAttribute("data-bib-id");
    const pre = document.getElementById(id);
    if (!pre) {
      alert("BibTeX block not found.");
      return;
    }

    const ok = await copyTextToClipboard(pre.innerText);
    if (!ok) alert("Copy failed. Please select and copy manually.");
  });
</script>
