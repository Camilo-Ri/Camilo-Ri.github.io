---
layout: archive
title: "Publications"
permalink: /publications/
author_profile: true
robots: "noindex,follow"
---

<style>
  /* Minimal styling that blends with AcademicPages */
  .pub-controls{
    margin: 1rem 0 1.25rem 0;
    padding: .9rem;
    border: 1px solid rgba(0,0,0,.12);
    background: rgba(0,0,0,.03);
    border-radius: 10px;
    display: grid;
    gap: .75rem;
  }
  .pub-controls-row{
    display: grid;
    grid-template-columns: 1fr;
    gap: .65rem;
  }
  @media (min-width: 760px){
    .pub-controls-row{ grid-template-columns: 1.2fr .7fr .6fr; align-items: end; }
  }
  .field label{
    display:block;
    font-size:.92rem;
    opacity:.8;
    margin-bottom:.25rem;
  }
  .field input, .field select{
    width:100%;
    padding:.55rem .6rem;
    border:1px solid rgba(0,0,0,.15);
    border-radius:8px;
    background:#fff;
    font-size:.95rem;
  }
  .pub-stats{
    display:flex;
    gap:.6rem;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
  }
  .pub-stats .count{ opacity:.8; font-size:.95rem; }
  .pub-stats .btns{ display:flex; gap:.5rem; flex-wrap:wrap; }
  .pub-controls button{
    padding:.45rem .7rem;
    border:1px solid rgba(0,0,0,.15);
    border-radius:8px;
    background:#fff;
    font-size:.92rem;
    cursor:pointer;
  }

  section.pub-section { margin-top: 1.35rem; }
  section.pub-section h2 { margin-bottom: .25rem; }
  section.pub-section hr { margin-top: .25rem; }

  ol.pub-list { margin-top: .75rem; }

  details.pub-bib{
    margin-top: .55rem;
    border-left: 4px solid rgba(0,0,0,.15);
    background: rgba(0,0,0,.03);
    padding: .55rem .7rem;
    border-radius: 10px;
  }
  details.pub-bib > summary{ cursor:pointer; font-weight:600; }

  pre.pub-pre{
    margin:.6rem 0 .45rem 0;
    padding:.65rem;
    background: rgba(0,0,0,.06);
    border-radius: 8px;
    overflow:auto;
    font-size:.88rem;
    border:1px solid rgba(0,0,0,.12);
    white-space: pre;
  }
  .copy-row{ display:flex; justify-content:flex-end; gap:.5rem; flex-wrap:wrap; }
  .copy-row button{ padding:.35rem .6rem; font-size:.9rem; }

  .pub-links a{
    text-decoration:none;
    border: 1px solid rgba(0,0,0,.15);
    border-radius: 999px;
    padding: .1rem .55rem;
    font-size: .85rem;
    margin-right: .35rem;
    display: inline-block;
    margin-top: .3rem;
  }
  .pub-links a:hover{ text-decoration: underline; }

  .toast{
    position: fixed;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    background: rgba(0,0,0,.88);
    color: #fff;
    padding: .6rem .75rem;
    border-radius: 10px;
    font-size: .92rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 160ms ease;
    z-index: 9999;
    max-width: calc(100vw - 24px);
    text-align:center;
  }
  .toast.show{ opacity: 1; }

  /* hide empty sections after filtering */
  .pub-section[data-hidden="1"]{ display:none; }
</style>

<section class="pub-controls" aria-label="Publication controls">
  <div class="pub-controls-row">
    <div class="field">
      <label for="q">Search (title, authors, venue)</label>
      <input id="q" type="text" placeholder="e.g., adaptive, reaction wheel, concurrent learning..." autocomplete="off" />
    </div>

    <div class="field">
      <label for="sec">Section</label>
      <select id="sec">
        <option value="__all__">All</option>
        <option value="wip">Work in Progress / Under Review</option>
        <option value="journal">Journal Articles</option>
        <option value="conference">Conference Papers</option>
        <option value="other">Other</option>
      </select>
    </div>

    <div class="field">
      <label for="yr">Year</label>
      <select id="yr">
        <option value="__all__">All</option>
      </select>
    </div>
  </div>

  <div class="pub-stats">
    <div class="count" id="count"></div>
    <div class="btns">
      <button type="button" id="expandAll">Expand all BibTeX</button>
      <button type="button" id="collapseAll">Collapse all BibTeX</button>
      <button type="button" id="reset">Reset</button>
    </div>
  </div>
</section>

<div id="sections"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

{%- assign pubs_all = site.publications | sort: "date" | reverse -%}

<script>
  const PUBS = [
    {% for p in pubs_all %}
    {
      title: {{ p.title | jsonify }},
      permalink: {{ p.url | relative_url | jsonify }},
      year: {{ p.date | date: "%Y" | jsonify }},
      date: {{ p.date | date: "%Y-%m-%d" | jsonify }},
      category: {{ p.category | default: "other" | jsonify }},
      venue: {{ p.venue | default: "" | jsonify }},
      publication_type: {{ p.publication_type | default: "" | jsonify }},
      authors: {{ p.authors | join: ", " | jsonify }},
      pdf: {{ p.pdf | default: "" | jsonify }},
      doi: {{ p.doi | default: "" | jsonify }},
      arxiv: {{ p.arxiv | default: "" | jsonify }},
      bibtex: {{ p.bibtex | default: "" | jsonify }}
    }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ];

  const SECTION_TITLES = {
    wip: "Work in Progress / Under Review",
    journal: "Journal Articles",
    conference: "Conference Papers",
    other: "Other"
  };
  const SECTION_ORDER = ["wip", "journal", "conference", "other"];

  const els = {
    q: document.getElementById('q'),
    sec: document.getElementById('sec'),
    yr: document.getElementById('yr'),
    sections: document.getElementById('sections'),
    count: document.getElementById('count'),
    expandAll: document.getElementById('expandAll'),
    collapseAll: document.getElementById('collapseAll'),
    reset: document.getElementById('reset'),
    toast: document.getElementById('toast'),
  };

  function toast(msg){
    els.toast.textContent = msg;
    els.toast.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => els.toast.classList.remove('show'), 1400);
  }

  function norm(s){
    return (s || '').toString().toLowerCase().replace(/\s+/g,' ').trim();
  }
  function unique(arr){
    return Array.from(new Set(arr.filter(Boolean)));
  }

  function buildYearFilter(){
    const years = unique(PUBS.map(p => p.year)).sort((a,b) => Number(b) - Number(a));
    years.forEach(y => {
      const opt = document.createElement('option');
      opt.value = String(y);
      opt.textContent = String(y);
      els.yr.appendChild(opt);
    });
  }

  function matches(pub){
    const q = norm(els.q.value);
    const sec = els.sec.value;
    const yr = els.yr.value;

    if (sec !== '__all__' && pub.category !== sec) return false;
    if (yr !== '__all__' && String(pub.year) !== yr) return false;

    if (!q) return true;

    const hay = norm([pub.title, pub.authors, pub.venue, pub.publication_type].join(' | '));
    return hay.includes(q);
  }

  function linkForDoi(doi){
    if (!doi) return "";
    return doi.startsWith("http") ? doi : `https://doi.org/${doi}`;
  }
  function linkForArxiv(arxiv){
    if (!arxiv) return "";
    return arxiv.startsWith("http") ? arxiv : `https://arxiv.org/abs/${arxiv}`;
  }

  function render(){
    const filtered = PUBS.filter(matches);
    els.count.textContent = `${filtered.length} / ${PUBS.length} shown`;

    // group by category
    const groups = {};
    SECTION_ORDER.forEach(k => groups[k] = []);
    filtered.forEach(p => (groups[p.category] ||= []).push(p));

    els.sections.innerHTML = '';

    SECTION_ORDER.forEach(cat => {
      const items = groups[cat] || [];

      const section = document.createElement('section');
      section.className = 'pub-section';
      section.dataset.cat = cat;

      if (items.length === 0) section.dataset.hidden = "1";

      const h2 = document.createElement('h2');
      h2.textContent = SECTION_TITLES[cat] || cat;
      section.appendChild(h2);

      const hr = document.createElement('hr');
      section.appendChild(hr);

      const ol = document.createElement('ol');
      ol.className = 'pub-list';

      items.forEach((pub, idx) => {
        const li = document.createElement('li');

        // Title (links to details page)
        const title = document.createElement('strong');
        const a = document.createElement('a');
        a.href = pub.permalink;
        a.textContent = pub.title || "Untitled";
        title.appendChild(a);
        li.appendChild(title);

        // Authors
        const authors = document.createElement('div');
        authors.style.marginTop = ".2rem";
        authors.innerHTML = pub.authors ? pub.authors : "";
        li.appendChild(authors);

        // Venue + year
        const venueLine = [];
        if (pub.venue) venueLine.push(pub.venue);
        if (pub.publication_type) venueLine.push(pub.publication_type);
        const v = document.createElement('div');
        v.style.opacity = ".85";
        v.style.marginTop = ".15rem";
        v.innerHTML = (venueLine.length ? `<em>${venueLine.join(" — ")}</em>` : "") + (pub.year ? `, ${pub.year}` : "");
        li.appendChild(v);

        // Links
        const links = document.createElement('div');
        links.className = 'pub-links';

        if (pub.pdf){
          const l = document.createElement('a');
          l.href = pub.pdf;
          l.textContent = 'PDF';
          l.rel = 'noopener';
          links.appendChild(l);
        }
        if (pub.arxiv){
          const l = document.createElement('a');
          l.href = linkForArxiv(pub.arxiv);
          l.textContent = 'arXiv';
          l.rel = 'noopener';
          links.appendChild(l);
        }
        if (pub.doi){
          const l = document.createElement('a');
          l.href = linkForDoi(pub.doi);
          l.textContent = 'DOI';
          l.rel = 'noopener';
          links.appendChild(l);
        }

        if (links.childNodes.length) li.appendChild(links);

        // BibTeX
        if (pub.bibtex){
          const details = document.createElement('details');
          details.className = 'pub-bib';
          details.dataset.bib = "1";

          const summary = document.createElement('summary');
          summary.textContent = "Show BibTeX";
          details.appendChild(summary);

          const pre = document.createElement('pre');
          pre.className = 'pub-pre';
          pre.textContent = pub.bibtex;
          details.appendChild(pre);

          const row = document.createElement('div');
          row.className = 'copy-row';

          const btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = 'Copy BibTeX';
          btn.addEventListener('click', async () => {
            try{
              await navigator.clipboard.writeText(pub.bibtex);
              toast('BibTeX copied!');
            }catch(e){
              const ta = document.createElement('textarea');
              ta.value = pub.bibtex;
              document.body.appendChild(ta);
              ta.select();
              try { document.execCommand('copy'); toast('BibTeX copied!'); }
              catch(_) { toast('Copy failed. Please copy manually.'); }
              document.body.removeChild(ta);
            }
          });

          row.appendChild(btn);
          details.appendChild(row);
          li.appendChild(details);
        }

        ol.appendChild(li);
      });

      section.appendChild(ol);
      els.sections.appendChild(section);
    });
  }

  function setAllBib(open){
    document.querySelectorAll('details[data-bib="1"]').forEach(d => d.open = open);
  }
  function reset(){
    els.q.value = '';
    els.sec.value = '__all__';
    els.yr.value = '__all__';
    render();
  }

  buildYearFilter();
  render();

  els.q.addEventListener('input', render);
  els.sec.addEventListener('change', render);
  els.yr.addEventListener('change', render);
  els.expandAll.addEventListener('click', () => setAllBib(true));
  els.collapseAll.addEventListener('click', () => setAllBib(false));
  els.reset.addEventListener('click', reset);
</script>
